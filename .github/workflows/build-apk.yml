# ============================================================================
# BUILD APK — PT Dapur Laut (TWA / Bubblewrap)
#
# Menghasilkan file APK Android yang bisa di-install manual dan dikirim
# lewat WhatsApp. Menjalankan Bubblewrap di ubuntu-latest (Java + Android SDK
# otomatis disiapkan).
#
# Cara pakai:
#   1. Upload proyek ini ke GitHub (repo baru).
#   2. Buka tab "Actions" → pilih workflow "Build APK — PT Dapur Laut".
#   3. Klik "Run workflow" (atau otomatis jalan saat push ke main).
#   4. Setelah selesai, buka hasilnya → bagian "Artifacts" →
#      unduh `dapurlaut-apk` → file `app-release-signed.apk`.
#   5. Kirim APK itu lewat WhatsApp. Penerima install manual di Android.
#
# Keystore (kunci penandatangan):
#   - Pertama kali otomatis dibuat & diunggah sebagai artifact `android-keystore`.
#     SIMPAN FILE ITU — tanpa kunci yang sama, versi APK berikutnya tidak bisa
#     di-install di atas versi lama (update butuh tanda tangan yang sama).
#   - Untuk update: set secret GitHub bernama `KEYSTORE_BASE64` berisi isi file
#     keystore lama dalam base64 (mis. `base64 -w0 android.keystore`).
#     Workflow memakai secret itu bila tersedia.
#
# Password keystore bawaan: dapurlaut123
# ============================================================================
name: Build APK — PT Dapur Laut

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java (17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: "35"
          build-tools: "35.0.0"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Siapkan keystore penandatangan
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > twa/android.keystore
            echo "Menggunakan keystore dari secret (stabil untuk update)."
          elif [ -f twa/android.keystore ]; then
            echo "Menggunakan keystore yang ada di repo."
          else
            keytool -genkeypair -v \
              -keystore twa/android.keystore \
              -alias dapurlaut \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass dapurlaut123 -keypass dapurlaut123 \
              -dname "CN=PT Dapur Laut, OU=IT, O=PT Dapur Laut, L=Batam, ST=Kepulauan Riau, C=ID"
            echo "Keystore baru dibuat (password: dapurlaut123)."
          fi

      - name: Build APK dengan Bubblewrap
        working-directory: twa
        run: |
          bubblewrap build --skipPwaValidation \
            --keystorePath android.keystore \
            --keystorePass dapurlaut123 \
            --keyPass dapurlaut123 \
            --keyAlias dapurlaut

      - name: Cetak fingerprint SHA-256 (untuk assetlinks)
        run: |
          keytool -list -v -keystore twa/android.keystore -alias dapurlaut -storepass dapurlaut123 2>/dev/null | grep "SHA256:" || echo "(keytool gagal membaca keystore)"

      - name: Unggah APK (dikirim via WhatsApp)
        uses: actions/upload-artifact@v4
        with:
          name: dapurlaut-apk
          path: twa/app-release-signed.apk

      - name: Unggah keystore (SIMPAN BAIK-BAIK)
        uses: actions/upload-artifact@v4
        with:
          name: android-keystore
          path: twa/android.keystore
